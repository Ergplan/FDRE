# Staging stack: PostgreSQL, the API (which also serves the built workspace), one or more
# workers, a nightly backup sidecar and Caddy for TLS. Copy deploy/.env.staging.example to
# deploy/.env.staging and fill it in; secrets never enter the image or git.
#
#   docker compose -f deploy/docker-compose.staging.yml --env-file deploy/.env.staging up -d --build
#   docker compose -f deploy/docker-compose.staging.yml run --rm api python -m fdre_platform.cli migrate
#   docker compose -f deploy/docker-compose.staging.yml run --rm api python -m fdre_platform.cli bootstrap --org-slug ergplan --org-name Ergplan --admin-email you@org --admin-name Admin --password '...'
#
# Written on Day 7 in an environment without a Docker daemon: the files are complete but the
# image build and the compose bring-up are untested here (see docs/platform/DAY-7-REPORT.md).
name: fdre-staging
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fdre
      POSTGRES_USER: fdre
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fdre -d fdre"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: fdre-platform:staging
    env_file: .env.staging
    environment:
      DATABASE_URL: postgresql+psycopg://fdre:${POSTGRES_PASSWORD}@db:5432/fdre
      DATA_DIR: /data
      SECURE_COOKIES: "true"
    volumes:
      - objectstore:/data
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped

  worker:
    image: fdre-platform:staging
    command: ["python", "-m", "fdre_platform.worker"]
    env_file: .env.staging
    environment:
      DATABASE_URL: postgresql+psycopg://fdre:${POSTGRES_PASSWORD}@db:5432/fdre
      DATA_DIR: /data
    volumes:
      - objectstore:/data
    depends_on:
      db:
        condition: service_healthy
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    restart: unless-stopped

  backup:
    image: fdre-platform:staging
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do /app/deploy/backup.sh /backups; sleep 86400; done"]
    environment:
      DATABASE_URL: postgresql://fdre:${POSTGRES_PASSWORD}@db:5432/fdre
      DATA_DIR: /data
    volumes:
      - objectstore:/data:ro
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS, e.g. staging.example.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  objectstore:
  backups:
  caddydata:
